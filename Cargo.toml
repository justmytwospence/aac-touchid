[package]
name = "aac-touchid"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Background Bitwarden Agent Access listener that approves each credential request with Touch ID"
repository = "https://github.com/justmytwospence/aac-touchid"
publish = false

[dependencies]
ap-client = { version = "=0.11.0", features = ["native-websocket"] }
ap-noise = "=0.11.0"
ap-proxy-protocol = "=0.11.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
hex = "0.4"
libc = "0.2"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[profile.release]
strip = true
lto = "thin"

[lints.clippy]
unwrap_used = "deny"
