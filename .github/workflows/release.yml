name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: macos-aarch64
          - target: x86_64-apple-darwin
            name: macos-x86_64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
        if: matrix.target == 'aarch64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf aac-touchid-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release aac-touchid
      - uses: actions/upload-artifact@v4
        with:
          name: aac-touchid-${{ matrix.name }}
          path: aac-touchid-${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum aac-touchid-*.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" aac-touchid-*.tar.gz SHA256SUMS --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "macOS builds of aac-touchid ${{ github.ref_name }}."
